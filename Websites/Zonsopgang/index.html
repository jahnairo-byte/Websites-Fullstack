<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupsenrace</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/addons/p5.sound.min.js"></script>
</head>
<body>
<p>Zonsopkomst</p>
<script>
  //variables for color change
let redVal = 0;
let greenVal = 0;

//variable for sun position
let sunHeight = 600; //stopping point below horizon

function setup() {
  createCanvas(600, 400);
  //textSize(20);
  noStroke();
}

function draw() {

  sky();

  sun();

  mountains();

  bushes(100, 400, 20);
  bushes(400, 400, 30);
  bushes(500, 500, 30);
  
 function sky(){
   //fill background with color based on custom variable values
  background(redVal, greenVal, 0);
  }
  
  function sun (){
   //sun
  fill(255, 135, 5, 60);
  circle(300, sunHeight, 180);
  fill(255, 100, 0, 100);
  circle(300, sunHeight, 140);
  }

  function mountains(){
    //mountains
  fill(110, 50, 18);
  triangle(200, 400, 520, 253, 800, 400);
  fill(110,95,20);
  triangle(200,400,520,253,350,400);  
  
  fill(150, 75, 0);
  triangle(-100, 400, 150, 200, 400, 400);
  fill(100, 50, 12);
  triangle(-100, 400, 150, 200, 0, 400); 
  
  fill(150, 100, 0);
  triangle(200, 400, 450, 250, 800, 400);
  fill(120, 80, 50);
  triangle(200, 400, 450, 250, 300, 400);
  }

  function bushes(x,y,size){
    //bushes
  fill(0, 100, 0);
  triangle(x-size*3,y,x,y-size*8,x+size*3,y)
  }

  // reduce sunHeight by 2 until it reaches 140 
  if (sunHeight > 130) {
    sunHeight -= 2;
    
    // modify custom variables for sky color during sunrise
 
    if (sunHeight < 480) {
      redVal += 4;
      greenVal += 1;
    }
  }
}  
</script>

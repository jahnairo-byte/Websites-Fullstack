<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eerste Script</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/addons/p5.sound.min.js"></script>
</head>
<body>
<p>Landschap</p>
<script>
    let cloudOneX = 50;

function setup() {
  createCanvas(400, 400);
}

function draw() {
//background
background('rgb(112, 217, 255)');

ellipse(cloudOneX, 50, 100, 30);
ellipse(cloudOneX + 80, 80, 80, 20);

cloudOneX = frameCount % width

//
  fill("rgb(33, 148, 22)");
triangle(-100,300,100,50, 250,300);
//
  fill("rgb(33, 148, 22)");
triangle(100,300,300,100, 500,300);

//
fill('rgb(34,189,62)');
rect(0,175,150,25);
///
fill('rgb(34,189,62)');
rect(250,225,150,25);
///

  fill('rgb(107, 67, 25)');
  rect(0,300, 400, 100);
///

fill('rgb(171, 102, 29)');
rect(0, 200,150, 200);
///

fill('rgb(171, 102, 29)');
rect(250, 250,150, 150);

///

//displays the x and y position of the mouse on the canvas
  fill(255) //white text
  text(`mouseX: ${mouseX}, mouseY: ${mouseY}`, 20, 20);  
}
</script>
